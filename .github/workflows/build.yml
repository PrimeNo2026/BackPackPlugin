name: Build Plugin

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: ZIP entpacken
        run: unzip -o BackpackPlugin-Source.zip

      - name: Bauen
        run: mvn -B package
        working-directory: BackpackPlugin

      - name: Jar hochladen
        uses: actions/upload-artifact@v4
        with:
          name: BackpackPlugin-jar
          path: BackpackPlugin/target/BackpackPlugin-*.jar
