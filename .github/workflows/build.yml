name: Build Plugin

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: ZIP entpacken
        run: unzip -o BackpackPlugin-Source.zip

      - name: Bauen
        run: mvn -B package
        working-directory: BackpackPlugin

      - name: Jar hochladen (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: BackpackPlugin-jar
          path: BackpackPlugin/target/BackpackPlugin-*.jar

      - name: Release mit .jar veroeffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: BackpackPlugin/target/BackpackPlugin-*.jar
